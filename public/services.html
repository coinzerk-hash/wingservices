<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل الخدمات — WingServices</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <svg viewBox="0 0 40 40" fill="none"><path d="M4 22c6-2 10-8 10-16 6 4 8 10 6 18-2 3-5 5-9 5-4 0-7-3-7-7z" fill="#C9A24C"/><path d="M36 22c-6-2-10-8-10-16-6 4-8 10-6 18 2 3 5 5 9 5 4 0 7-3 7-7z" fill="#E8C873"/></svg>
      Wing<span class="accent">Services</span>
    </a>
    <nav class="nav-links">
      <a href="/">الرئيسية</a>
      <a href="/services.html" class="active">كل الخدمات</a>
      <a href="/#how-it-works">طريقة الطلب</a>
      <a href="/#reviews">آراء العملاء</a>
    </nav>
    <div class="nav-actions">
      <a href="/login.html" data-auth="guest" class="btn btn-outline btn-sm">دخول</a>
      <a href="/account.html" data-auth="user" class="btn btn-outline btn-sm" style="display:none;">حسابي</a>
      <a href="/cart.html" class="cart-pill">🛒 السلة <span class="count cart-count" style="display:none;">0</span></a>
    </div>
    <button class="nav-toggle" aria-label="القائمة">☰</button>
  </div>
</header>

<section class="page-hero-small">
  <div class="container">
    <span class="hero-eyebrow">الكتالوج الكامل</span>
    <h1>كل خدمات WingServices</h1>
    <p class="lead">فلتر حسب الفئة، شوف السعر والميعاد، وأضف اللي يعجبك للسلة.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="category-filter" id="cat-filter">
      <button class="chip active" data-slug="">الكل</button>
    </div>
    <div class="flight-board" id="board">
      <div class="board-row head">
        <span>الخدمة</span><span>الفئة</span><span>يبدأ من</span><span>الميعاد</span><span></span>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container footer-bottom">
    <span>© 2026 WingServices. غير تابع لشركة Jagex Ltd.</span>
    <span>هذا موقع تجريبي لأغراض العرض فقط.</span>
  </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/chat-widget.js"></script>
<script>
let currentCategory = new URLSearchParams(location.search).get('category') || '';

async function loadCategories() {
  const cats = await api('/api/categories');
  const wrap = document.getElementById('cat-filter');
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (currentCategory === c.slug ? ' active' : '');
    btn.textContent = c.name;
    btn.dataset.slug = c.slug;
    btn.addEventListener('click', () => {
      currentCategory = c.slug;
      document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      loadServices();
    });
    wrap.appendChild(btn);
  });
  wrap.querySelector('.chip[data-slug=""]').addEventListener('click', (e) => {
    currentCategory = '';
    document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
    e.target.classList.add('active');
    loadServices();
  });
  if (currentCategory) {
    document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
    const match = [...document.querySelectorAll('.chip')].find(el => el.dataset.slug === currentCategory);
    if (match) match.classList.add('active');
  }
}

async function loadServices() {
  const board = document.getElementById('board');
  board.querySelectorAll('.board-row:not(.head)').forEach(el => el.remove());
  const url = currentCategory ? `/api/services?category=${encodeURIComponent(currentCategory)}` : '/api/services';
  const services = await api(url);
  if (services.length === 0) {
    board.innerHTML += '<div class="board-row"><span>لا توجد خدمات في هذه الفئة حاليًا</span></div>';
    return;
  }
  services.forEach(s => {
    const row = document.createElement('div');
    row.className = 'board-row';
    row.innerHTML = `
      <span class="board-service">${s.name}<small>${s.description || ''}</small></span>
      <span>${s.category_name}</span>
      <span class="board-price">$${s.price_from}</span>
      <span class="board-eta">${s.eta || ''}</span>
      <button class="btn btn-primary btn-sm" data-id="${s.id}">أضف للسلة</button>
    `;
    row.querySelector('button').addEventListener('click', async (e) => {
      e.target.disabled = true;
      e.target.textContent = '...';
      try {
        await api('/api/cart/add', { method: 'POST', body: JSON.stringify({ service_id: s.id, quantity: 1 }) });
        showToast(`تمت إضافة "${s.name}" للسلة`);
        refreshCartBadge();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        e.target.disabled = false;
        e.target.textContent = 'أضف للسلة';
      }
    });
    board.appendChild(row);
  });
}

loadCategories().then(loadServices);
</script>
</body>
</html>
