<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — WingServices</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <svg viewBox="0 0 40 40" fill="none"><path d="M4 22c6-2 10-8 10-16 6 4 8 10 6 18-2 3-5 5-9 5-4 0-7-3-7-7z" fill="#C9A24C"/><path d="M36 22c-6-2-10-8-10-16-6 4-8 10-6 18 2 3 5 5 9 5 4 0 7-3 7-7z" fill="#E8C873"/></svg>
      Wing<span class="accent">Services</span>
    </a>
    <nav class="nav-links">
      <a href="/">الرئيسية</a>
      <a href="/services.html">كل الخدمات</a>
    </nav>
    <div class="nav-actions">
      <button id="logout-btn" class="btn btn-outline btn-sm">خروج</button>
      <a href="/cart.html" class="cart-pill">🛒 السلة <span class="count cart-count" style="display:none;">0</span></a>
    </div>
  </div>
</header>

<section class="page-hero-small">
  <div class="container">
    <h1 id="welcome">حسابي</h1>
    <p>تابع طلباتك وحالتها من هنا.</p>
  </div>
</section>

<section>
  <div class="container">
    <div id="guest-msg" class="empty-state" style="display:none;">
      <h3>سجل دخولك الأول</h3>
      <p>يجب تسجيل الدخول لعرض طلباتك.</p>
      <a href="/login.html" class="btn btn-primary">تسجيل الدخول</a>
    </div>

    <div id="orders-wrap" style="display:none;">
      <div class="flight-board" id="orders-board">
        <div class="board-row head">
          <span>رقم الطلب</span><span>الخدمات</span><span>الإجمالي</span><span>الحالة</span><span>التاريخ</span>
        </div>
      </div>
      <div id="no-orders" class="empty-state" style="display:none;">
        <h3>لسه معملتش أي طلب</h3>
        <a href="/services.html" class="btn btn-primary">تصفح الخدمات</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container footer-bottom">
    <span>© 2026 WingServices. غير تابع لشركة Jagex Ltd.</span>
  </div>
</footer>

<script src="/js/main.js"></script>
<script src="/js/chat-widget.js"></script>
<script>
async function init() {
  const { user } = await api('/api/auth/me');
  if (!user) {
    document.getElementById('guest-msg').style.display = 'block';
    return;
  }
  document.getElementById('welcome').textContent = `أهلاً، ${user.rsn || user.email}`;
  document.getElementById('orders-wrap').style.display = 'block';

  const orders = await api('/api/orders/my');
  const board = document.getElementById('orders-board');
  if (orders.length === 0) {
    document.getElementById('no-orders').style.display = 'block';
    return;
  }
  orders.forEach(o => {
    const row = document.createElement('div');
    row.className = 'board-row';
    const itemNames = o.items.map(i => i.service_name).join('، ');
    row.innerHTML = `
      <span>#${o.id}</span>
      <span class="board-service">${itemNames}</span>
      <span class="board-price">$${o.total.toFixed(0)}</span>
      <span><span class="badge-status ${o.status}">${o.status}</span></span>
      <span class="board-eta">${new Date(o.created_at).toLocaleDateString('ar-EG')}</span>
    `;
    board.appendChild(row);
  });
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await api('/api/auth/logout', { method: 'POST' });
  location.href = '/';
});

init();
</script>
</body>
</html>
