<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — WingServices</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">
      <svg viewBox="0 0 40 40" fill="none"><path d="M4 22c6-2 10-8 10-16 6 4 8 10 6 18-2 3-5 5-9 5-4 0-7-3-7-7z" fill="#C9A24C"/><path d="M36 22c-6-2-10-8-10-16-6 4-8 10-6 18 2 3 5 5 9 5 4 0 7-3 7-7z" fill="#E8C873"/></svg>
      Wing<span class="accent">Services</span>
    </a>
    <nav class="nav-links"><a href="/services.html">كل الخدمات</a></nav>
    <div class="nav-actions"><a href="/cart.html" class="cart-pill">🛒 السلة <span class="count cart-count" style="display:none;">0</span></a></div>
  </div>
</header>

<div class="form-panel">
  <h2 style="text-align:center;">إنشاء حساب جديد</h2>
  <form id="register-form">
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label for="rsn">اسم الحساب في اللعبة (RSN)</label>
      <input type="text" id="rsn" required>
    </div>
    <div class="field">
      <label for="discord">يوزر الديسكورد (اختياري)</label>
      <input type="text" id="discord">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input type="password" id="password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
    <div class="form-msg" id="msg"></div>
  </form>
  <p class="form-footer-link">عندك حساب بالفعل؟ <a href="/login.html">سجل دخولك</a></p>
</div>

<script src="/js/main.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  msg.textContent = '';
  try {
    await api('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        rsn: document.getElementById('rsn').value,
        discord: document.getElementById('discord').value,
        password: document.getElementById('password').value,
      }),
    });
    msg.textContent = 'تم إنشاء الحساب! جاري التحويل...';
    msg.classList.add('success');
    setTimeout(() => location.href = '/account.html', 700);
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add('error');
  }
});
</script>
</body>
</html>
